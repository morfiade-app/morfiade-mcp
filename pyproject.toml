[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "morfiade-mcp"
version = "0.1.0"
description = "Launcher for the Morfiade MCP server — manage local Chrome profiles on Windows from an AI agent"
readme = "README.md"
requires-python = ">=3.7"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Morfiade", email = "github@morfiade.com" }]
keywords = ["mcp", "model-context-protocol", "chrome", "profiles", "multi-account", "browser-automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://morfiade.com/en/"
Repository = "https://github.com/morfiade-app/morfiade-mcp"
Documentation = "https://github.com/morfiade-app/morfiade-mcp/blob/main/docs/TOOLS.md"

[project.scripts]
morfiade-mcp = "morfiade_mcp:main"

[tool.setuptools]
py-modules = ["morfiade_mcp"]
